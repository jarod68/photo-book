name: Build & Push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build app
        run: npm run build

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jarod68/photo-book
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Software supply-chain: generate a CycloneDX SBOM from the pushed image with
  # Syft, scan it with Grype (report-only gate), and upload the SBOM to
  # Dependency-Track (https://dtrack.holtz.fr) for continuous SCA. Needs repo
  # secrets DTRACK_URL and DTRACK_API_KEY (an automation-team key with
  # BOM_UPLOAD + PROJECT_CREATION_UPLOAD); DTRACK_BASIC_AUTH only if /api is
  # behind the Traefik basic-auth.
  sbom:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install Syft & Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate CycloneDX SBOM (Syft)
        # Pin CycloneDX to 1.6 — recent Syft defaults to 1.7, which
        # Dependency-Track 4.12 rejects with HTTP 400 (it supports up to 1.6).
        run: syft "jarod68/photo-book:latest" -o cyclonedx-json@1.6=sbom.cdx.json
      - name: Scan the SBOM (Grype)
        # Report-only for now — drop `|| true` to fail the build on a critical CVE.
        run: grype "sbom:sbom.cdx.json" --fail-on critical || true
      - name: Upload SBOM to Dependency-Track
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
          # "user:password" for the Traefik basic-auth guarding dtrack.holtz.fr (only if /api is gated).
          DTRACK_BASIC_AUTH: ${{ secrets.DTRACK_BASIC_AUTH }}
        run: |
          # If the dtrack host's /api is behind Traefik basic-auth, send those
          # creds too (set DTRACK_BASIC_AUTH); Dependency-Track authenticates the
          # upload itself via X-Api-Key. When /api is open, leave the secret unset.
          auth=()
          [ -n "$DTRACK_BASIC_AUTH" ] && auth=(-u "$DTRACK_BASIC_AUTH")
          # Capture DT's response body — it explains a 400 (bad BOM / spec version).
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$DTRACK_URL/api/v1/bom" \
            "${auth[@]}" \
            -H "X-Api-Key: $DTRACK_API_KEY" \
            -F "autoCreate=true" \
            -F "projectName=photo-book" \
            -F "projectVersion=latest" \
            -F "bom=@sbom.cdx.json")
          echo "HTTP $code"; cat resp.txt; echo
          [ "$code" -lt 300 ] || exit 1
