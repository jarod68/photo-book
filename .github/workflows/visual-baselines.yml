name: Update visual baselines

# Regenerates the Playwright screenshots (tests/visual_tests/snapshots) in the
# same Linux image as CI's `visual` job and commits them to the chosen branch.
# Run it after an intended UI change — from the Actions tab, or by putting
# [update-baselines] in a commit message on a branch (a workflow that is not on
# main yet cannot be started by hand) — then review the images in the commit.
# Its commit does not start CI by itself (GitHub's rule for GITHUB_TOKEN): the
# next push to the branch checks the new baselines.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    # never commits straight to main; on push, only when asked in the message
    if: >-
      github.ref != 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-baselines]'))
    permissions:
      contents: write
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: photobook, POSTGRES_PASSWORD: photobook, POSTGRES_DB: photobook }
        options: --health-cmd "pg_isready -U photobook" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      POSTGRES_HOST: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: scripts/e2e-server.sh start
      - name: Regenerate the screenshots
        run: |
          rm -rf tests/visual_tests/snapshots
          npx playwright test --update-snapshots
        env: { ADMIN_PASS: Admin@test1 }
      - name: Commit them to the branch
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A tests/visual_tests/snapshots
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git commit -m "test(visual): refresh Linux baselines (Playwright 1.64.1 image)"
          git push
