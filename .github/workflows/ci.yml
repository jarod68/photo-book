name: CI

# Same release flow as mine-sim: CI → :qa (QA, rolled out by Keel) → manual
# "Promote to prod" (promote.yml) → :latest (prod, rolled out by Keel).
# Tests run on every branch; only a push to main builds and ships an image.
on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking gate: unit + integration tests (Vitest) with coverage thresholds
  # (vitest.config.mjs — the run fails below them).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # End-to-end: the built app against a real PostgreSQL, driven by the Robot
  # Framework suites (tests/integration_tests) in Chromium.
  robot:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: photobook, POSTGRES_PASSWORD: photobook, POSTGRES_DB: photobook }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U photobook" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-robot.txt
      - run: npm ci
      - run: pip install -r requirements-robot.txt && rfbrowser init chromium
      - run: scripts/e2e-server.sh start
      - name: Robot suites
        run: >
          robot --outputdir robot-results
          --variable ADMIN_PASS:Admin@test1 --variable BASIC_USER:robot-basic --variable BASIC_PASS:Robot@basic1
          tests/integration_tests/suites/
      - name: Robot report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-report
          path: |
            robot-results/
            ${{ runner.temp }}/photo-book-e2e/server.log
          retention-days: 14

  # Visual regression: Playwright screenshots compared with the Linux
  # baselines in tests/visual_tests/snapshots. Runs in Playwright's own image
  # (same browsers and fonts as the baselines). After an intended UI change,
  # refresh them with Actions → "Update visual baselines" on the branch.
  visual:
    runs-on: ubuntu-latest
    needs: test
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: photobook, POSTGRES_PASSWORD: photobook, POSTGRES_DB: photobook }
        options: --health-cmd "pg_isready -U photobook" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      POSTGRES_HOST: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: scripts/e2e-server.sh start
      - name: Playwright visual tests
        run: npx playwright test
        env: { ADMIN_PASS: Admin@test1 }
      - name: Playwright report (diffs) as artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-report
          path: |
            tests/visual_tests/report/
            test-results/
          retention-days: 14

  # Supply-chain gate: build the image locally (amd64, not pushed), generate a
  # CycloneDX SBOM with Syft and scan it with Grype. Fails on any High/Critical
  # CVE that has a fix available (`--only-fixed`); unfixable findings are still
  # listed but don't block. Runs before `docker`, so a vulnerable image is never
  # pushed.
  sbom:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write   # upload the CVEs to Security → Code scanning
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci && npm run build      # the image copies dist/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: photo-book:scan
          cache-from: type=gha
      - name: Install Syft & Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate CycloneDX SBOM (Syft)
        run: syft "docker:photo-book:scan" -o cyclonedx-json@1.6=sbom.cdx.json
      # Full report first (every CVE, fixable or not) so it is visible even
      # when the gate below fails: the run summary, Security → Code scanning
      # and a downloadable artifact.
      - name: Scan the SBOM (Grype) — full report
        run: grype "sbom:sbom.cdx.json" -o table -o json=grype.json -o sarif=grype.sarif
      - name: CVE table in the run summary
        if: always()
        run: jq -r --arg image "jarod68/photo-book (amd64)" -f .github/grype-summary.jq grype.json >> "$GITHUB_STEP_SUMMARY"
      - name: CVEs to Security → Code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
          category: grype-image
      - name: SBOM + CVE report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cve-report
          path: |
            sbom.cdx.json
            grype.json
          retention-days: 30
      # Gate: fail on any High/Critical CVE that has a fix available.
      - name: Gate — fixable High/Critical block the build
        run: grype "sbom:sbom.cdx.json" --fail-on high --only-fixed -q -o table

  # Build + push the multi-arch image to Docker Hub. Only on a push to main, and
  # only once the `test` and `sbom` gates are green. Pushes :sha-<commit> (kept,
  # for promotion / rollback) and :qa, which Keel rolls out to qa.book.holtz.fr.
  # :latest (prod) is never touched here — see promote.yml.
  docker:
    runs-on: ubuntu-latest
    needs: [test, robot, visual, sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci && npm run build
      - uses: docker/setup-qemu-action@v3        # emulation for the arm64 build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            jarod68/photo-book:sha-${{ github.sha }}
            jarod68/photo-book:qa
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
