<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- web app: installable, own icon and colours (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book — Sign in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">
  <div id="lang-switcher"></div>
  <div class="login-card">
    <a href="/" class="login-back" data-i18n="login.back">← Back</a>
    <h1 class="login-logo">Photo Book<span class="login-dot">.</span></h1>

    <form id="login-form" class="login-form" novalidate>
      <div class="login-field">
        <label for="username" class="login-label" data-i18n="login.username">Username</label>
        <input id="username" class="login-input" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="login-field">
        <label for="password" class="login-label" data-i18n="login.password">Password</label>
        <input id="password" class="login-input" type="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="login-error" hidden></p>
      <button type="submit" class="login-btn">
        <svg class="login-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 018 0v4"/>
        </svg>
        <span class="login-btn-text" data-i18n="login.submit">Sign in</span>
      </button>
    </form>

    <!-- the second step: the authenticator app's code (pages/login.js) -->
    <form id="code-form" class="login-form" novalidate hidden>
      <p class="login-code-hint" data-i18n="login.codeHint">Enter the 6-digit code of your authenticator app — or one of your backup codes.</p>
      <div class="login-field">
        <label for="code" class="login-label" data-i18n="login.code">Code</label>
        <input id="code" class="login-input login-code" type="text" inputmode="numeric" autocomplete="one-time-code"
               autocapitalize="none" spellcheck="false" maxlength="12" required>
      </div>
      <p id="code-error" class="login-error" hidden></p>
      <button type="submit" class="login-btn"><span class="login-btn-text" data-i18n="login.verify">Verify</span></button>
    </form>

    <!-- other ways in (shown when configured) -->
    <div id="login-sso" class="login-sso" hidden>
      <span class="login-sso-or" data-i18n="login.or">or</span>
      <a href="/api/auth/google" class="login-google">
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.3 5.7c4.3-4 7-9.8 7-17.1z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-4.1-13.6-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
        <span data-i18n="login.google">Sign in with Google</span>
      </a>
    </div>
  </div>

  <script type="module" src="pages/login.js"></script>
</body>
</html>
