<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- web app: installable, own icon and colours (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-profile">

  <header class="map-page-header">
    <a href="index.html" class="map-page-back profile-back" data-i18n-aria="map.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="map-page-title-wrap">
      <h1 class="map-page-title" id="profile-title"></h1>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <main class="profile">
    <p id="profile-message" class="carnet-message" hidden></p>
    <header id="profile-head" class="profile-head" hidden>
      <div id="profile-avatar" class="avatar avatar--xl"></div>
      <div class="profile-who">
        <h2 id="profile-name" class="profile-name"></h2>
        <p id="profile-username" class="profile-username"></p>
        <p id="profile-bio" class="profile-bio"></p>
      </div>
    </header>
    <!-- their travels in figures (pages/profile.js) -->
    <dl id="profile-stats" class="about-stats profile-stats" hidden></dl>
    <section id="profile-albums" class="home-section" hidden>
      <h2 class="home-section-title" data-i18n="profile.albums">Albums</h2>
      <div id="profile-album-grid" class="album-grid"></div>
    </section>
    <section id="profile-articles" class="home-section" hidden>
      <h2 class="home-section-title" data-i18n="profile.articles">Stories</h2>
      <div id="profile-article-grid" class="article-grid"></div>
    </section>
    <p id="profile-empty" class="carnet-empty" hidden data-i18n="profile.none">Nothing to show yet.</p>
  </main>

  <script type="module" src="pages/profile.js"></script>
</body>
</html>
