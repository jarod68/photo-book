<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- web app: installable, own icon and colours (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-album">

  <header class="map-page-header">
    <a href="index.html" class="map-page-back" data-i18n-aria="map.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="map-page-title-wrap">
      <h1 class="map-page-title" data-i18n="art.diary">Journal</h1>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <!-- the album: cover, name, dates, description (pages/album.js) -->
  <section id="carnet-hero" class="carnet-hero" hidden></section>

  <main class="carnet">
    <p id="carnet-message" class="carnet-message" hidden></p>
    <section id="carnet-articles" class="carnet-section" hidden>
      <div class="carnet-section-head">
        <h2 class="carnet-section-title" data-i18n="art.articles">Articles</h2>
        <a id="carnet-new" class="carnet-btn carnet-btn--accent" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="art.new">New article</span>
        </a>
      </div>
      <ol id="carnet-list" class="carnet-list"></ol>
    </section>
    <section id="carnet-photos" class="carnet-section" hidden>
      <div class="carnet-section-head">
        <h2 class="carnet-section-title" data-i18n="art.photos">Photos</h2>
        <a id="carnet-all" class="carnet-btn"></a>
      </div>
      <div id="carnet-grid" class="carnet-grid"></div>
    </section>
  </main>

  <script type="module" src="pages/album.js"></script>
</body>
</html>
