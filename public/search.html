<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- web app: installable, own icon and colours (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book — Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-search">

  <header class="map-page-header">
    <a href="index.html" class="map-page-back" data-i18n-aria="map.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="map-page-title-wrap">
      <h1 class="map-page-title" data-i18n="search.title">Search</h1>
      <p id="search-count" class="map-page-count" aria-live="polite"></p>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <form id="search-form" class="search-filters" role="search">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search-q" class="search-input" type="search" name="q" autocomplete="off"
             data-i18n-placeholder="search.placeholder" placeholder="Title, place, country, album, month, camera…">
    </div>
    <div class="search-chips">
      <div class="search-chip search-dates">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <label class="search-field"><span data-i18n="search.from">From</span>
          <input id="search-from" type="date" name="from"></label>
        <label class="search-field"><span data-i18n="search.to">To</span>
          <input id="search-to" type="date" name="to"></label>
      </div>
      <select id="search-camera" name="camera" class="search-chip search-select">
        <option value="" data-i18n="search.anyCamera">All cameras</option>
      </select>
      <select id="search-album" name="album" class="search-chip search-select">
        <option value="" data-i18n="search.anyAlbum">All albums</option>
      </select>
      <button id="search-reset" type="reset" class="search-reset" data-i18n="search.reset">Clear</button>
    </div>
  </form>

  <main id="search-results" class="search-grid"></main>

  <script type="module" src="pages/search.js"></script>
</body>
</html>
