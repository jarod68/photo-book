<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photo Book — Globe</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three":           "/vendor/three/three.module.js",
      "three/addons/":   "/vendor/three/addons/"
    }
  }
  </script>
</head>
<body class="page-globe">

  <header class="globe-header">
    <a href="index.html" class="globe-back" data-i18n-aria="nav.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </a>
    <div class="globe-title-wrap">
      <h1 class="globe-title" data-i18n="globe.title">Globe 3D</h1>
      <p id="globe-count" class="globe-count"></p>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <div id="globe-container">
    <div id="globe-loading" class="globe-loading">
      <div class="globe-loading-dot"></div>
    </div>
  </div>

  <!-- Photo pin popup — lives outside container, positioned via project() -->
  <div id="globe-popup" class="globe-popup" data-open="false">
    <button id="globe-popup-close" class="globe-popup-close" aria-label="Close">×</button>
    <div class="globe-popup-inner">
      <span class="map-popup-album globe-popup-album"></span>
      <strong class="globe-popup-title"></strong>
      <span class="map-popup-date globe-popup-date"></span>
      <img class="globe-popup-img" alt="">
      <a class="map-popup-view globe-popup-link"></a>
    </div>
  </div>

  <script src="vendor/topojson-client/topojson-client.min.js"></script>
<script type="module" src="pages/globe.js"></script>
</body>
</html>
