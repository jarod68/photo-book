<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photo Book — Globe</title>
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three":           "/vendor/three/three.module.js",
      "three/addons/":   "/vendor/three/addons/",
      "maplibre-gl":     "/vendor/maplibre-gl/maplibre-gl.mjs"
    }
  }
  </script>
</head>
<body class="page-globe">

  <header class="globe-header">
    <a href="index.html" class="globe-back" data-i18n-aria="nav.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </a>
    <div class="globe-title-wrap">
      <h1 class="globe-title" data-i18n="globe.title">Globe 3D</h1>
      <p id="globe-count" class="globe-count"></p>
    </div>
    <button type="button" id="globe-tz-btn" class="globe-tz-btn" aria-pressed="false" data-i18n-title="globe.timezones">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="globe.timezones">Time zones</span>
    </button>
    <div id="globe-modes" class="globe-modes" role="group">
      <button type="button" id="globe-up" data-i18n-title="globe.backToSpace" data-i18n-aria="globe.backToSpace">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      </button>
      <button type="button" data-mode="satellite" aria-pressed="true" data-i18n="globe.satellite">Satellite</button>
      <button type="button" data-mode="map" aria-pressed="false" data-i18n="globe.map">Map</button>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <div id="globe-container">
    <!-- the Earth from space (Three.js) -->
    <div id="globe-space" class="globe-layer"></div>
    <!-- below ~1 400 km: satellite / street map (MapLibre) -->
    <div id="globe-near" class="globe-layer"></div>
    <div id="globe-loading" class="globe-loading">
      <div class="globe-loading-dot"></div>
    </div>
    <div class="globe-switch-spinner" aria-hidden="true"><div class="globe-loading-dot"></div></div>
    <div id="globe-tz-tip" class="globe-tz-tip" hidden></div>
    <p id="globe-credit" class="globe-credit"></p>
  </div>

  <script type="module" src="pages/globe.js"></script>
</body>
</html>
