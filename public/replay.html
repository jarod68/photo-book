<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-replay" data-replay="loading">

  <header class="map-page-header replay-header">
    <a href="index.html" class="map-page-back" data-i18n-aria="map.back">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <div class="map-page-title-wrap">
      <h1 class="map-page-title" data-i18n="replay.title">Replay the trip</h1>
    </div>
    <div id="lang-switcher"></div>
  </header>

  <!-- the map (MapLibre, satellite globe) and, over it, the captions and
       photos drawn on a canvas, so the video records them (pages/replay.js) -->
  <main id="replay-stage" class="replay-stage">
    <div id="replay-map" class="replay-map"></div>
    <canvas id="replay-overlay" class="replay-overlay"></canvas>
    <p id="replay-message" class="replay-message" hidden></p>
  </main>

  <footer class="replay-bar">
    <button type="button" id="replay-play" class="replay-play" data-i18n-aria="replay.play" disabled>
      <svg class="replay-icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="replay-icon-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="replay-progress"><div id="replay-progress-bar"></div></div>
    <span id="replay-step" class="replay-step"></span>
    <select id="replay-speed" class="replay-speed" data-i18n-aria="replay.speed">
      <option value="0.5">×0.5</option>
      <option value="1" selected>×1</option>
      <option value="2">×2</option>
      <option value="4">×4</option>
    </select>
    <button type="button" id="replay-record" class="carnet-btn replay-record" data-i18n-aria="replay.record" disabled>
      <span class="replay-rec-dot" aria-hidden="true"></span>
      <span data-i18n="replay.record">Record the video</span>
    </button>
    <a id="replay-download" class="carnet-btn carnet-btn--accent" hidden>
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>
      <span data-i18n="replay.download">Download</span>
    </a>
  </footer>

  <script type="module" src="pages/replay.js"></script>
</body>
</html>
