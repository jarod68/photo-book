<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- web app: installable, own icon and colours (manifest.webmanifest) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Photo Book">
  <title>Photo Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-home">

  <header class="home-header">
    <div class="home-header-left">
      <h1 class="home-logo">Photo Book</h1>
    </div>
    <div class="home-header-right">
      <a href="search.html" class="home-search-btn" data-i18n-title="search.title">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span data-i18n="search.title">Search</span>
      </a>
      <div id="lang-switcher"></div>
      <div id="home-auth" class="home-auth"></div>
    </div>
  </header>

  <main>
    <!-- the latest album, full width (pages/home.js) -->
    <section id="home-hero" class="home-hero" hidden></section>

    <section class="home-section">
      <h2 class="home-section-title" data-i18n="home.explore">Explore</h2>
      <div id="explore-grid" class="explore-grid"></div>
    </section>

    <section class="home-section">
      <div class="home-section-head">
        <h2 class="home-section-title" data-i18n="home.albums">Albums</h2>
        <p id="summary" class="home-summary"></p>
        <select id="album-sort" class="home-sort" data-i18n-aria="home.sort" hidden>
          <option value="name" data-i18n="home.sortName">A–Z</option>
          <option value="recent" data-i18n="home.sortRecent">Most recent</option>
          <option value="oldest" data-i18n="home.sortOldest">Oldest</option>
        </select>
      </div>
      <div id="album-grid" class="album-grid"></div>
    </section>
  </main>

  <script type="module" src="pages/home.js"></script>
</body>
</html>
