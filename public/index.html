<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Photo Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-home">

  <header class="home-header">
    <div class="home-header-left">
      <h1 class="home-logo">Photo Book</h1>
      <div class="home-summary-row">
        <p id="summary" class="home-summary"></p>
        <select id="album-sort" class="home-sort" data-i18n-aria="home.sort" hidden>
          <option value="name" data-i18n="home.sortName">A–Z</option>
          <option value="recent" data-i18n="home.sortRecent">Most recent</option>
          <option value="oldest" data-i18n="home.sortOldest">Oldest</option>
        </select>
      </div>
    </div>
    <div class="home-header-right">
      <div id="lang-switcher"></div>
      <div id="home-auth" class="home-auth"></div>
    </div>
  </header>

  <main>
    <div id="album-grid" class="album-grid"></div>
  </main>

  <script type="module" src="pages/home.js"></script>
</body>
</html>
